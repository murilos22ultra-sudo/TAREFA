<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAREFAS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>TAREFAS</h1>
    <div class="header-actions">
      <button class="btn blue" id="btnNovo" type="button">+ Criar tarefa</button>
      <button class="btn purple" id="btnNovoLembrete" type="button">+ Criar lembrete</button>
      <button class="btn green" id="btnExport" type="button">Exportar Excel</button>
    </div>
  </header>

  <section class="lembretes-card">
    <h2>LEMBRETES <span class="count" id="reminderCount">(0)</span></h2>
    <div id="listaLembretes"></div>
  </section>

  <main class="kanban">
    <div class="coluna" data-status="A Fazer">
      <h2>A Fazer</h2>
    </div>

    <div class="coluna" data-status="Em Progresso">
      <h2>Em Progresso</h2>
    </div>

    <div class="coluna" data-status="Concluído">
      <h2>Concluído</h2>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>Cadastrar atividade</h3>
      <input id="taskTitle" type="text" placeholder="Título">
      <textarea id="taskDesc" placeholder="Descrição"></textarea>
      <input id="taskDate" type="date">

      <select id="taskPriority">
        <option>Alta</option>
        <option selected>Média</option>
        <option>Baixa</option>
      </select>

      <div class="check-row">
        <input id="checkInput" type="text" placeholder="Item do checklist">
        <button class="btn gray" id="addCheck" type="button">Adicionar</button>
      </div>

      <div id="checkPreview"></div>

      <div class="modal-actions">
        <button class="btn gray" id="cancel" type="button">Cancelar</button>
        <button class="btn blue" id="save" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <div id="modalLembrete" class="modal hidden">
    <div class="modal-box">
      <h3>Criar lembrete</h3>
      <input id="lembreteTitulo" type="text" placeholder="Digite o lembrete">
      <input id="lembreteData" type="date">
      <input id="lembreteHora" type="time">

      <div class="modal-actions">
        <button class="btn gray" id="cancelarLembrete" type="button">Cancelar</button>
        <button class="btn purple" id="salvarLembrete" type="button">Salvar</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
